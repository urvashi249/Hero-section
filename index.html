<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codegrin | Digital Architects</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body class="font-['Poppins'] bg-[#F8FFFE] text-[#0D4C44] overflow-x-hidden selection:bg-teal-100">

<!-- Background Blobs -->
<div class="fixed inset-0 -z-10 pointer-events-none">
  <div class="absolute w-[400px] h-[400px] bg-teal-500/10 rounded-full blur-[120px] -top-20 -left-20"></div>
  <div class="absolute w-[300px] h-[300px] bg-emerald-500/5 rounded-full blur-[100px] bottom-0 right-0"></div>
</div>

<!-- Hero Section -->
<section class="relative min-h-screen flex items-center pt-24 pb-16 px-6 sm:px-10 md:px-20">
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center w-full max-w-7xl mx-auto">
    
    <!-- LEFT CONTENT (Mobile order 1) -->
    <div class="order-1 text-center lg:text-left space-y-10">
      
      <!-- Unique Rajkot Badge -->
      <div class="inline-block relative group">
        <div class="absolute -inset-1 bg-gradient-to-r from-teal-400 to-emerald-400 rounded-full blur opacity-0 group-hover:opacity-20 transition-opacity duration-500"></div>
        <div class="relative flex items-center gap-3 bg-white border border-teal-100 px-4 py-2 rounded-full shadow-sm group-hover:border-teal-200 transition-all">
          
          <div class="relative flex items-center justify-center h-4 w-4">
            <div class="absolute h-full w-full rounded-full bg-emerald-100"></div>
            <div class="absolute h-full w-full rounded-full bg-emerald-400 animate-ping opacity-40"></div>
            <div class="relative h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></div>
          </div>

          <span class="text-[10px] md:text-[11px] font-black tracking-[0.3em] text-teal-900 uppercase">
            BUILT IN  <span class="text-emerald-500 group-hover:text-emerald-600 transition-colors">RAJKOT</span> 
            - PRACTICAL LEARNING
          </span>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="text-5xl md:text-6xl lg:text-7xl font-black leading-tight tracking-tight">
        Crafting The <br>
        <span class="bg-clip-text text-transparent bg-gradient-to-r from-[#0D4C44] via-[#14b8a6] to-[#0D4C44] bg-[length:200%_auto] animate-[pulse_3s_ease-in-out_infinite]">
          Bold Future</span> <br>of Code.
      </h1>

      <p class="text-gray-500 text-lg max-w-xl mx-auto lg:mx-0 border-l-2 border-teal-500/30 pl-6 leading-relaxed">
        Beyond tutorials, into the <span class="text-[#0D4C44] font-bold">corporate ecosystem</span>. 
        Architect your IT career with <span class="text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-emerald-500 font-extrabold">
        100% hands-on training</span> that scales your skills from <span class="text-teal-700 font-semibold underline decoration-teal-100 underline-offset-4">code-level</span> 
        to <span class="text-[#0D4C44] font-black uppercase tracking-tight">corporate-level</span>.
      </p>
    
      <!-- CTA Buttons -->
      <div class="flex flex-col sm:flex-row items-center justify-center lg:justify-start gap-4">
        <button class="w-full sm:w-auto bg-[#0D4C44] text-white px-10 py-4 font-bold rounded-xl shadow-xl shadow-teal-900/20 hover:scale-105 transition-transform active:scale-95">
          Explore Courses <span>→</span>
        </button>
        <button class="w-full sm:w-auto border-2 border-[#0D4C44]/10 text-[#0D4C44] px-10 py-4 font-bold rounded-xl hover:bg-white transition-all">
          View Projects
        </button>
      </div>
    </div>

    <!-- RIGHT VISUAL (Mobile order 2) -->
    <div class="order-2 relative flex justify-center items-center">
      
      <!-- [CARD 1] Architecture / Clean Code -->
      <div class="absolute -top-6 -left-4 md:-top-10 md:-left-10 z-30 animate-bounce transition-all">
        <div class="bg-white/90 backdrop-blur-xl border border-teal-100 shadow-xl rounded-2xl px-4 py-3 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-teal-50 flex items-center justify-center text-teal-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3m8-6l4 3-4 3M14 4l-4 16"/></svg>
          </div>
          <div>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Architecture</p>
            <p class="text-sm font-black text-[#0D4C44]">Clean Code</p>
          </div>
        </div>
      </div>

      <!-- [CARD 2] Performance / Fast Launch -->
      <div class="absolute bottom-12 -right-4 md:bottom-20 md:-right-8 z-30 animate-bounce transition-all" style="animation-delay: 0.5s;">
        <div class="bg-white/90 backdrop-blur-xl border border-teal-100 shadow-xl rounded-2xl px-4 py-3 flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-cyan-50 flex items-center justify-center text-cyan-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div>
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Performance</p>
            <p class="text-sm font-black text-[#0D4C44]">Fast Launch</p>
          </div>
        </div>
      </div>

      <!-- Background Shapes -->
     <!-- Background Shape 1 (Opacity Fill) -->
<div class="absolute w-[110%] h-[110%] bg-[#0D4C44] opacity-[0.03] -rotate-6 [clip-path:polygon(20%_0%,80%_0%,100%_20%,100%_80%,80%_100%,20%_100%,0%_80%,0%_20%)]"></div>

<!-- Background Shape 2 (Border) -->
<div class="absolute w-[105%] h-[105%] border-2 border-teal-500/10 rotate-3 [clip-path:polygon(20%_0%,80%_0%,100%_20%,100%_80%,80%_100%,20%_100%,0%_80%,0%_20%)]"></div>

<!-- Glow behind image -->
<div class="absolute w-64 h-64 md:w-80 md:h-80 bg-teal-500/20 rounded-full blur-[100px]"></div>

<!-- Main Image Container -->
<div class="relative p-3 md:p-5 bg-white shadow-2xl transition-transform duration-500 hover:rotate-1 [clip-path:polygon(20%_0%,80%_0%,100%_20%,100%_80%,80%_100%,20%_100%,0%_80%,0%_20%)]">
  
  <div class="w-64 h-64 md:w-[420px] md:h-[420px] overflow-hidden [clip-path:polygon(20%_0%,80%_0%,100%_20%,100%_80%,80%_100%,20%_100%,0%_80%,0%_20%)]">
    <img src="image/hero-img.jpg" alt="hero" 
         class="w-full h-full object-cover transition-all duration-700 hover:scale-110">
  </div>  
</div>
</div>
</div>
</section>
</body>
</html>
